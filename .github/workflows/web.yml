name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  merge_group:
  # The full suite every night on main, so that a slow regression shows up even on a quiet day.
  schedule:
    - cron: "43 2 * * *"

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  # Decides what has to run. A pull request that changes only documentation (docs/, *.md, the balance sheets)
  # cannot break a headless test, so its shards are skipped and `tests` still reports green. Every other pull
  # request, push and merge queue entry runs the required tests (tests/ci_manifest.txt), the quest tests whose
  # files it touches and, as a warning only, the other test files it changed (tests/ci_select.sh). The nightly
  # and manual runs run everything (docs/testing.md, "What goes in the required check").
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.scope.outputs.full }}
      nightly: ${{ steps.scope.outputs.nightly }}
      quests: ${{ steps.scope.outputs.quests }}
      skip: ${{ steps.scope.outputs.skip }}
      shards: ${{ steps.scope.outputs.shards }}
      known: ${{ steps.scope.outputs.known }}
      extra: ${{ steps.scope.outputs.extra }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ "$EVENT" = schedule ] || [ "$EVENT" = workflow_dispatch ]; then
            { echo "full=true"; echo "nightly=true"; echo "quests=all"; echo "extra="; echo "shards=[0,1,2,3,4,5]"; } >> "$GITHUB_OUTPUT"
            echo "Full run ($EVENT): every test."; exit 0
          fi
          # Pull requests use 4 shards, not 6: every job pays for its own setup and the runner pool is shared
          # by all open PRs, so fewer, longer jobs finish sooner overall (docs/testing.md).
          { echo "nightly=false"; echo "shards=[0,1,2,3]"; } >> "$GITHUB_OUTPUT"
          # Required tests that already fail on main (latest nightly run) do not block this run.
          echo "known=$(tests/ci_known_failing.sh | tail -n 1)" | tee -a "$GITHUB_OUTPUT"
          # A push to main that merges a pull request was tested as that pull request; the nightly run tests
          # main as a whole. Only a direct push (no "(#123)" or "Merge pull request") runs the shards.
          if [ "$EVENT" = push ] && git log -1 --format=%s | grep -Eq '\(#[0-9]+\)$|^Merge pull request'; then
            echo "full=false" >> "$GITHUB_OUTPUT"; echo "A merged pull request on main: the nightly run tests it."; exit 0
          fi
          if ! changed=$(git diff --name-only "$BASE"...HEAD 2>/dev/null); then
            { echo "full=true"; echo "quests=all"; echo "extra="; } >> "$GITHUB_OUTPUT"
            echo "No base to compare with ($EVENT): the required and all quest tests."; exit 0
          fi
          # Patch note fragments are checked by tests/launcher.gd (the Windows build used to check them), so they count.
          other=$( (echo "$changed" | grep -Ev '^(docs/|balance/|.*\.md$|\.gitattributes$|LICENSE)'; echo "$changed" | grep -E '^docs/patch_(notes|history)') | grep . || true)
          if [ "$EVENT" = pull_request ] && [ -z "$other" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"; echo "Only documentation changed: the tests are skipped."; exit 0
          fi
          echo "full=true" >> "$GITHUB_OUTPUT"
          echo "$changed" | grep . | tests/ci_select.sh | tee -a "$GITHUB_OUTPUT"

  # The fast checks: the gate for pull requests, and what the Windows build on main waits for
  # (desktop.yml). The browser export is optional and lives in browser.yml.
  # The tests are split into parallel shards of about equal length (tests/ci_shard.sh, the list is
  # tests/ci_manifest.txt plus the picked quest tests, the measured lengths tests/ci_timings.txt).
  # `tests` at the end gathers them into one check: that single name is what branch protection requires
  # and what the Windows build waits for, however many shards there are.
  shard:
    name: tests-shard (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4

      - name: Godot and the imported project
        uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}
          save-import: ${{ github.event_name != 'pull_request' && matrix.shard == 0 }}

      - name: Tests of this shard
        env:
          CI_QUESTS: ${{ needs.scope.outputs.quests }}
          CI_SKIP: ${{ needs.scope.outputs.skip }}
          CI_KNOWN: ${{ needs.scope.outputs.known }}
        run: tests/ci_shard.sh blocking ${{ matrix.shard }} ${{ strategy.job-total }}

      # The nightly run keeps the names of the tests that failed twice: pull requests quarantine them
      # (tests/ci_known_failing.sh) until they pass on main again.
      - name: Keep the failed tests of this nightly run
        if: ${{ always() && needs.scope.outputs.nightly == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: failed-blocking-${{ matrix.shard }}
          path: ci_logs/failed.txt
          if-no-files-found: ignore

  # The test files a pull request or push changed that are not required (tests/ci_nightly.txt, or not listed
  # anywhere yet), so a new or edited test runs once. Not part of `tests`, so it never blocks a merge. It starts
  # only once `tests` has reported, so it never takes a runner that the required shards are waiting for (GitHub
  # runs only so many jobs at once), and auto-merge does not wait for it.
  extra:
    name: extra-tests
    needs: [scope, tests]
    if: ${{ !cancelled() && needs.scope.outputs.nightly == 'false' && needs.scope.outputs.extra != '' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Godot and the imported project
        uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Changed tests that are not required (a failure is only a warning)
        env:
          CI_EXTRA: ${{ needs.scope.outputs.extra }}
        run: tests/ci_shard.sh extra 0 1

  # Every test that is not required (tests/ci_nightly.txt and tests listed nowhere yet), in the nightly and
  # manual runs only, alongside the required shards (which then run every quest test too). A failure is a
  # warning on that run; fix it the next day.
  nightly:
    name: nightly-tests (${{ matrix.shard }})
    needs: scope
    if: needs.scope.outputs.nightly == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Godot and the imported project
        uses: ./.github/actions/godot-setup
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Nightly tests of this shard (a failure is only a warning)
        run: tests/ci_shard.sh nightly ${{ matrix.shard }} 8

  # The one required check. It passes when every blocking shard passed, or when the shards were skipped
  # on purpose (a documentation-only pull request).
  tests:
    if: always()
    needs: [scope, shard]
    runs-on: ubuntu-latest
    steps:
      - name: All shards must have passed
        run: |
          echo "scope: full=${{ needs.scope.outputs.full }}, shards: ${{ needs.shard.result }}"
          if [ "${{ needs.scope.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.scope.outputs.full }}" = false ]; then test "${{ needs.shard.result }}" = skipped; else test "${{ needs.shard.result }}" = success; fi
