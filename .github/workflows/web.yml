name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  # The fast checks: the gate for pull requests, and what the Windows build on main waits for
  # (desktop.yml). The browser export is optional and lives in browser.yml.
  # The tests are split into parallel shards (tests/ci_shard.sh, the list is tests/ci_manifest.txt).
  # `tests` at the end gathers them into one check: that single name is what branch protection requires
  # and what the Windows build waits for, however many shards there are.
  shard:
    name: tests-shard (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $templates
          unzip -qj Godot_v*_export_templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d $templates
          rm Godot_v*_export_templates.tpz

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Tests of this shard
        run: tests/ci_shard.sh blocking ${{ matrix.shard }} 8

  # Every test in tests/ that the manifest does not list. A new test runs from the day it is added, but
  # only warns until it is listed (see docs/testing.md). Not part of `tests`, so it never blocks a merge.
  extra:
    name: extra-tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $templates
          unzip -qj Godot_v*_export_templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d $templates
          rm Godot_v*_export_templates.tpz

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Extra tests of this shard (a failure is only a warning)
        run: tests/ci_shard.sh extra ${{ matrix.shard }} 4

  # The one required check. It passes when every blocking shard passed.
  tests:
    if: always()
    needs: [shard]
    runs-on: ubuntu-latest
    steps:
      - name: All shards must have passed
        run: |
          echo "shards: ${{ needs.shard.result }}"
          test "${{ needs.shard.result }}" = success
