name: Windows download

# Builds the Windows version: Escape.exe (the launcher, see scripts/launcher.gd) and the game,
# game/Escape.exe (the bare engine) with its data game/Escape.pck, and publishes them on the release "windows",
# always under the same links:
#   https://github.com/devilbane/escape/releases/download/windows/Escape-Windows.zip  (for players)
#   .../windows/version.json, Escape.exe, EscapeGame.exe, Escape.pck                 (for the launcher)
# A build is published
#   - after every green nightly run of the tests on main,
#   - after a pull request labelled `big-feature` merges (big-feature-build.yml starts this workflow), and
#   - by hand (Actions > Windows download > Run workflow; "force" builds even if main did not change).
# It is skipped when main is still the commit of the last published build. Not every merge makes a build:
# runners are shared with the test shards, and the Windows build used to start on every pull request that
# added a patch note. A pull request that touches the launcher or this workflow builds it as a download on the
# workflow run (docs/testing.md, "Windows builds").

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "export_presets.cfg"
      - "assets/logo/app_icon.*"
      - "scenes/launcher.tscn"
      - "scripts/launcher.gd"
      - "scripts/ui_kit.gd"
      - "scripts/bronze_style.gd"
      - "scripts/lang/launcher.gd"
      - "tools/patch_notes.py"
      - "tests/launcher.gd"
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit to build (default: the newest commit of the branch)"
        required: false
      force:
        description: "Build even if this commit was already published"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  # Decides whether to build, so that a skipped build costs a few seconds, not a runner for minutes.
  gate:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.gate.outputs.go }}
      sha: ${{ steps.gate.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: gate
        env:
          EVENT: ${{ github.event_name }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_RESULT: ${{ github.event.workflow_run.conclusion }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_SHA: ${{ inputs.sha }}
          FORCE: ${{ inputs.force }}
        run: |
          sha=$GITHUB_SHA
          go=true
          case "$EVENT" in
            workflow_run)
              sha=$RUN_SHA
              # Only the nightly run of the tests makes a build; the push and pull request runs do not.
              if [ "$RUN_EVENT" != schedule ] || [ "$RUN_RESULT" != success ]; then go=false; echo "Not a green nightly run ($RUN_EVENT, $RUN_RESULT): no build."; fi;;
            workflow_dispatch)
              [ -n "$INPUT_SHA" ] && sha=$INPUT_SHA;;
          esac
          if [ "$go" = true ] && [ "$EVENT" != pull_request ] && [ "$FORCE" != true ]; then
            last=$(git ls-remote origin refs/tags/windows | cut -f1)
            if [ "$last" = "$sha" ]; then go=false; echo "main is still the last published build ($sha): no build."; fi
            # A nightly run that started before newer merges finishes later: never publish an older commit over a newer build.
            if [ "$go" = true ] && [ "$EVENT" = workflow_run ] && [ -n "$last" ] && git merge-base --is-ancestor "$sha" "$last" 2>/dev/null; then go=false; echo "$sha is older than the last published build ($last): no build."; fi
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"; echo "sha=$sha" >> "$GITHUB_OUTPUT"

  windows:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.gate.outputs.sha }}
          fetch-depth: 0 # the patch notes list the fragments added since the last published build (tag "windows")

      - name: Save-seal key (kept out of the repository)
        env:
          SEAL_KEY: ${{ secrets.SEAL_KEY }}
        run: |
          # scripts/sim/save_seal.gd seals saved games with this key. Without the secret the build seals nothing.
          if [ -n "$SEAL_KEY" ]; then
            printf 'extends RefCounted\n\nconst KEY := "%s"\n' "$SEAL_KEY" > scripts/seal_secret.gd
          else
            echo "::warning::No SEAL_KEY secret: this build does not seal saved games."
          fi

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-2

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $templates
          unzip -qj Godot_v*_export_templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/linux_release.x86_64 templates/version.txt -d $templates
          rm Godot_v*_export_templates.tpz

      - name: Restore the engine built with the data key
        id: encrypted
        env:
          PCK_KEY: ${{ secrets.PCK_KEY }}
        run: |
          # The game data is encrypted with a key built into a custom Windows engine (godot_templates.yml
          # compiles it once and caches it). Only the name of the cache is worked out here.
          if [ -n "$PCK_KEY" ]; then
            echo "id=$(printf %s "$PCK_KEY" | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No PCK_KEY secret: the game data is not encrypted."
          fi

      - name: Custom Windows engine from the cache
        id: templates
        if: steps.encrypted.outputs.id != ''
        uses: actions/cache/restore@v4
        with:
          path: ~/escape_templates
          key: escape-templates-${{ env.GODOT_VERSION }}-${{ steps.encrypted.outputs.id }}

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Launcher test
        run: |
          timeout 60 ~/godot/godot --headless -s tests/launcher.gd | tee launcher.log
          grep -q PASS launcher.log

      - name: Build number and launcher fingerprint
        env:
          PCK_KEY: ${{ secrets.PCK_KEY }}
        run: |
          # One number that only ever counts up, whoever started the build: the highest build number
          # known plus one. (The run numbers of this workflow and of "Tests" are two different counters, so a
          # build started by hand used to get a lower number than a nightly one: the launcher then saw
          # an older build, and the window and the patch notes stayed on the old one.) Without a
          # published build, or in a pull request, the run number of the workflow is used.
          build=${{ github.run_number }}
          if [ "${{ github.event_name }}" != pull_request ]; then
            # "Last" is the highest number ever published or archived (version.json, its history and the
            # committed notes archive), not just the newest build: earlier builds counted with the Tests
            # run number (3049 ...), so a lower number after them sorts below them in the launcher and in
            # the compendium's patch notes page.
            curl -sfL --max-time 30 -o published_version.json "https://github.com/${{ github.repository }}/releases/download/windows/version.json" || rm -f published_version.json
            last=$(python3 - <<'PY'
          import json, os
          nums = []
          def add(v):
              if str(v).isdigit():
                  nums.append(int(v))
          if os.path.exists("published_version.json"):
              d = json.load(open("published_version.json"))
              add(d.get("build", ""))
              for h in d.get("history") or []:
                  add(h.get("build", ""))
          try:
              for e in json.load(open("docs/patch_history.json")).get("builds", []):
                  add(e.get("build", ""))
          except (OSError, ValueError):
              pass
          print(max(nums) if nums else "")
          PY
            )
            [ -n "$last" ] && build=$((last + 1))
            rm -f published_version.json
          fi
          version=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' scripts/game.gd)
          # The launcher fetches a new Escape.exe only when this changes: its own files
          # and the engine, not every change to the game.
          rev=$( (echo "$GODOT_VERSION${PCK_KEY:+ encrypted}"; cat scripts/launcher.gd scripts/ui_kit.gd scripts/bronze_style.gd scenes/launcher.tscn scripts/lang/launcher.gd export_presets.cfg) | sha256sum | cut -c1-16)
          echo "BUILD=$build" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "REV=$rev" >> $GITHUB_ENV
          sed -i "s/^const BUILD := .*/const BUILD := \"$build\"/" scripts/game.gd
          grep -q "const BUILD := \"$build\"" scripts/game.gd
          sed -i "s/^const REV := .*/const REV := \"$rev\"/" scripts/launcher.gd
          grep -q "const REV := \"$rev\"" scripts/launcher.gd
          echo "Version $version.$build, launcher $rev"

      - name: Patch notes archive for the compendium
        run: |
          # Every build's notes, newest first, travel inside the game (docs/patch_history.json, the
          # compendium's patch notes page). The archive published with the previous build is merged
          # with the committed one and this build's notes, so nothing is lost when a build ships only
          # its own new notes (tools/patch_notes.py history).
          curl -sfL --max-time 30 -o previous_history.json \
            "https://github.com/${{ github.repository }}/releases/download/windows/patch_history.json" || rm -f previous_history.json
          python3 tools/patch_notes.py history "$BUILD" "$VERSION" "$(git rev-parse -q --verify refs/tags/windows || true)" previous_history.json > patch_history.new
          mv patch_history.new docs/patch_history.json
          cp docs/patch_history.json build_patch_history.json
          python3 -c "import json; a = json.load(open('docs/patch_history.json')); print(len(a['builds']), 'builds in the patch notes archive')"

      - name: Turn on data encryption
        id: encrypt
        env:
          PCK_KEY: ${{ secrets.PCK_KEY }}
        run: |
          if [ "${{ steps.templates.outputs.cache-hit }}" = true ] && [ -f ~/escape_templates/windows_release_x86_64.exe ]; then
            sed -i -e 's|^encryption_include_filters=""|encryption_include_filters="*"|' \
                   -e 's|^encrypt_pck=false|encrypt_pck=true|' \
                   -e 's|^encrypt_directory=false|encrypt_directory=true|' export_presets.cfg
            # Only the two Windows presets use the custom engine (the web preset is exported elsewhere).
            sed -i "s|^custom_template/release=\"\"|custom_template/release=\"$HOME/escape_templates/windows_release_x86_64.exe\"|" export_presets.cfg
            echo "on=true" >> "$GITHUB_OUTPUT"
            echo "The game data will be encrypted."
          else
            echo "::warning::No custom engine in the cache (run 'Godot templates' once): the game data is NOT encrypted."
          fi

      - name: Export the launcher and the game
        env:
          GODOT_SCRIPT_ENCRYPTION_KEY: ${{ secrets.PCK_KEY }}
        run: |
          mkdir -p build/Escape/game build/release
          ~/godot/godot --headless --export-release "Windows" build/Escape/Escape.exe
          # game/Escape.exe is the bare engine; it loads game/Escape.pck because of the name.
          ~/godot/godot --headless --export-release "Windows game" build/Escape/game/Escape.exe
          test -s build/Escape/Escape.exe && test -s build/Escape/game/Escape.exe && test -s build/Escape/game/Escape.pck
          # The game data must start with Godot's pack header.
          head -c 4 build/Escape/game/Escape.pck | grep -q GDPC
          if [ "${{ steps.encrypt.outputs.on }}" = true ]; then
            # Encrypted: the names and the content must not be readable in the file.
            ! grep -qa "res://scripts/game" build/Escape/game/Escape.pck
            ! grep -qa "func hero_record" build/Escape/game/Escape.pck
            ! grep -qa "SaveSeal" build/Escape/game/Escape.pck
          fi

      - name: Both exe files carry the application icon
        run: |
          pip install -q pefile
          python3 - <<'PY'
          import pefile
          for path in ("build/Escape/Escape.exe", "build/Escape/game/Escape.exe"):
              pe = pefile.PE(path, fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_RESOURCE"]])
              kinds = {e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries}
              assert pefile.RESOURCE_TYPE["RT_GROUP_ICON"] in kinds, path + " has no icon"
              print(path, "has the icon")
          PY

      - name: Start the exported launcher (with the Linux engine of the same build)
        # The official Linux engine cannot read data encrypted with our key.
        if: steps.encrypt.outputs.on != 'true'
        run: |
          # The pack inside Escape.exe ends with its size and "GDPC". Run it with the Linux
          # release engine, which behaves like the Windows one, against a server that is not
          # there: it must show its window and say it found no connection, without errors.
          mkdir -p build/smoke
          python3 - <<'PY'
          import struct
          data = open("build/Escape/Escape.exe", "rb").read()
          assert data[-4:] == b"GDPC", "Escape.exe carries no pack"
          size = struct.unpack("<Q", data[-12:-4])[0]
          open("build/smoke/Escape.pck", "wb").write(data[len(data) - 12 - size:len(data) - 12])
          PY
          cp ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/linux_release.x86_64 build/smoke/Escape
          chmod +x build/smoke/Escape
          timeout 60 build/smoke/Escape --headless --launcher-source=http://127.0.0.1:9/ --quit-after 600 2>&1 | tee smoke.log
          grep -q "Launcher: Suche nach einer neuen Version" smoke.log
          grep -q "Launcher: Das Spiel konnte nicht geladen werden" smoke.log
          ! grep -q "ERROR" smoke.log

      - name: Package
        run: |
          cd build
          engine=$(sha256sum Escape/game/Escape.exe | cut -d' ' -f1)
          echo "{\"version\":\"$VERSION\",\"build\":\"$BUILD\",\"engine\":\"$engine\"}" > Escape/game/installed.json
          # The patch notes also travel inside the zip, for the launcher's first start.
          python3 ../tools/patch_notes.py build "$(git rev-parse -q --verify refs/tags/windows || true)" > Escape/game/patch_notes.txt
          cp Escape/Escape.exe Escape/game/Escape.pck release/
          cp Escape/game/Escape.exe release/EscapeGame.exe
          cp ../build_patch_history.json release/patch_history.json
          zip -qr9 release/Escape-Windows.zip Escape
          python3 - <<'PY'
          import hashlib, json, os
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          env = os.environ
          # The launcher shows these patch notes while it downloads (docs/patch_notes.txt + docs/patch_notes.d, tools/patch_notes.py).
          import subprocess
          notes = subprocess.check_output(["python3", "../tools/patch_notes.py", "build", subprocess.run(["git", "rev-parse", "-q", "--verify", "refs/tags/windows"], capture_output=True, text=True).stdout.strip()], text=True)
          # A build's notes list only what is new in it, so the manifest also keeps the notes of the
          # recent builds before it: a player who skipped builds sees all of them (launcher.gd notes_since).
          history = [{"build": env["BUILD"], "notes": notes}]
          try:
              import urllib.request
              with urllib.request.urlopen("https://github.com/" + env["GITHUB_REPOSITORY"] + "/releases/download/windows/version.json", timeout=30) as r:
                  old = json.load(r)
              history += old.get("history") or [{"build": old["build"], "notes": old.get("notes", "")}]
          except Exception as e:
              print("no earlier version.json:", e)
          seen, kept = set(), []
          for h in history:
              if str(h["build"]) not in seen and len(kept) < 30:
                  seen.add(str(h["build"]))
                  kept.append(h)
          manifest = {
              "version": env["VERSION"], "build": env["BUILD"], "notes": notes, "history": kept,
              "pack_size": os.path.getsize("release/Escape.pck"), "pack_sha256": sha("release/Escape.pck"),
              "launcher": env["REV"], "launcher_file": "Escape.exe",
              "launcher_size": os.path.getsize("release/Escape.exe"), "launcher_sha256": sha("release/Escape.exe"),
              "engine_file": "EscapeGame.exe",
              "engine_size": os.path.getsize("release/EscapeGame.exe"), "engine_sha256": sha("release/EscapeGame.exe"),
          }
          json.dump(manifest, open("release/version.json", "w"), indent=1)
          print(json.dumps(manifest, indent=1))
          PY
          ls -la release

      - name: Keep the zip on this run
        uses: actions/upload-artifact@v4
        with:
          name: Escape-Windows-${{ env.VERSION }}.${{ env.BUILD }}
          path: build/Escape
          retention-days: 14

      - name: Publish on the release "windows"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.gate.outputs.sha }}
        run: |
          cd build/release
          notes="Escape! $VERSION.$BUILD for Windows.

          Download **Escape-Windows.zip**, unpack it anywhere and start **Escape.exe**. The launcher keeps the game up to date by itself.

          Built from $SHA."
          # The tag follows the newest build.
          git tag -f windows "$SHA"
          git push -f origin refs/tags/windows
          if gh release view windows >/dev/null 2>&1; then
            # The files first, version.json last: the launcher only looks for a new game once
            # the files it names are in place.
            gh release upload windows Escape.exe EscapeGame.exe Escape.pck Escape-Windows.zip patch_history.json --clobber
            gh release upload windows version.json --clobber
            gh release edit windows --title "Escape! for Windows ($VERSION.$BUILD)" --notes "$notes" --latest
          else
            gh release create windows Escape.exe EscapeGame.exe Escape.pck Escape-Windows.zip patch_history.json version.json \
              --title "Escape! for Windows ($VERSION.$BUILD)" --notes "$notes" --latest
          fi
