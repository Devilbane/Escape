name: Windows download

# Builds the Windows version: Escape.exe (the launcher, see scripts/launcher.gd) and the game,
# game/Escape.exe (the bare engine) with its data game/Escape.pck. After every run of the fast tests
# on main that passed, they are published on the GitHub release "windows", always under the same links:
#   https://github.com/devilbane/escape/releases/download/windows/Escape-Windows.zip  (for players)
#   .../windows/version.json, Escape.exe, EscapeGame.exe, Escape.pck                 (for the launcher)
# A pull request that touches the launcher builds it too, as a download on the workflow run.

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "export_presets.cfg"
      - "project.godot"
      - "assets/logo/app_icon.*"
      - "scenes/launcher.tscn"
      - "scripts/launcher.gd"
      - "scripts/ui_kit.gd"
      - "scripts/bronze_style.gd"
      - "scripts/lang/launcher.gd"
      - "docs/patch_notes.txt"
      - "docs/patch_notes.d/**"
      - "tools/patch_notes.py"
      - "tests/launcher.gd"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-${{ github.event_name == 'pull_request' && github.ref || 'release' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GODOT_VERSION: 4.7.2

jobs:
  windows:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0 # the patch notes list the fragments added since the last published build (tag "windows")

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-windows-2

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $templates
          unzip -qj Godot_v*_export_templates.tpz templates/windows_release_x86_64.exe templates/windows_debug_x86_64.exe templates/linux_release.x86_64 templates/version.txt -d $templates
          rm Godot_v*_export_templates.tpz

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Launcher test
        run: |
          timeout 60 ~/godot/godot --headless -s tests/launcher.gd | tee launcher.log
          grep -q PASS launcher.log

      - name: Build number and launcher fingerprint
        run: |
          # The same number as the browser build of this commit, so both show one version.
          build=${{ github.event.workflow_run.run_number || github.run_number }}
          version=$(sed -n 's/^const VERSION := "\(.*\)"/\1/p' scripts/game.gd)
          # The launcher fetches a new Escape.exe only when this changes: its own files
          # and the engine, not every change to the game.
          rev=$( (echo "$GODOT_VERSION"; cat scripts/launcher.gd scripts/ui_kit.gd scripts/bronze_style.gd scenes/launcher.tscn scripts/lang/launcher.gd export_presets.cfg) | sha256sum | cut -c1-16)
          echo "BUILD=$build" >> $GITHUB_ENV
          echo "VERSION=$version" >> $GITHUB_ENV
          echo "REV=$rev" >> $GITHUB_ENV
          sed -i "s/^const BUILD := .*/const BUILD := \"$build\"/" scripts/game.gd
          grep -q "const BUILD := \"$build\"" scripts/game.gd
          sed -i "s/^const REV := .*/const REV := \"$rev\"/" scripts/launcher.gd
          grep -q "const REV := \"$rev\"" scripts/launcher.gd
          echo "Version $version.$build, launcher $rev"

      - name: Export the launcher and the game
        run: |
          mkdir -p build/Escape/game build/release
          ~/godot/godot --headless --export-release "Windows" build/Escape/Escape.exe
          # game/Escape.exe is the bare engine; it loads game/Escape.pck because of the name.
          ~/godot/godot --headless --export-release "Windows game" build/Escape/game/Escape.exe
          test -s build/Escape/Escape.exe && test -s build/Escape/game/Escape.exe && test -s build/Escape/game/Escape.pck
          # The game data must start with Godot's pack header.
          head -c 4 build/Escape/game/Escape.pck | grep -q GDPC

      - name: Both exe files carry the application icon
        run: |
          pip install -q pefile
          python3 - <<'PY'
          import pefile
          for path in ("build/Escape/Escape.exe", "build/Escape/game/Escape.exe"):
              pe = pefile.PE(path, fast_load=True)
              pe.parse_data_directories(directories=[pefile.DIRECTORY_ENTRY["IMAGE_DIRECTORY_ENTRY_RESOURCE"]])
              kinds = {e.id for e in pe.DIRECTORY_ENTRY_RESOURCE.entries}
              assert pefile.RESOURCE_TYPE["RT_GROUP_ICON"] in kinds, path + " has no icon"
              print(path, "has the icon")
          PY

      - name: Start the exported launcher (with the Linux engine of the same build)
        run: |
          # The pack inside Escape.exe ends with its size and "GDPC". Run it with the Linux
          # release engine, which behaves like the Windows one, against a server that is not
          # there: it must show its window and say it found no connection, without errors.
          mkdir -p build/smoke
          python3 - <<'PY'
          import struct
          data = open("build/Escape/Escape.exe", "rb").read()
          assert data[-4:] == b"GDPC", "Escape.exe carries no pack"
          size = struct.unpack("<Q", data[-12:-4])[0]
          open("build/smoke/Escape.pck", "wb").write(data[len(data) - 12 - size:len(data) - 12])
          PY
          cp ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/linux_release.x86_64 build/smoke/Escape
          chmod +x build/smoke/Escape
          timeout 60 build/smoke/Escape --headless --launcher-source=http://127.0.0.1:9/ --quit-after 600 2>&1 | tee smoke.log
          grep -q "Launcher: Suche nach einer neuen Version" smoke.log
          grep -q "Launcher: Das Spiel konnte nicht geladen werden" smoke.log
          ! grep -q "ERROR" smoke.log

      - name: Package
        run: |
          cd build
          engine=$(sha256sum Escape/game/Escape.exe | cut -d' ' -f1)
          echo "{\"version\":\"$VERSION\",\"build\":\"$BUILD\",\"engine\":\"$engine\"}" > Escape/game/installed.json
          # The patch notes also travel inside the zip, for the launcher's first start.
          python3 ../tools/patch_notes.py build "$(git rev-parse -q --verify refs/tags/windows || true)" > Escape/game/patch_notes.txt
          cp Escape/Escape.exe Escape/game/Escape.pck release/
          cp Escape/game/Escape.exe release/EscapeGame.exe
          zip -qr9 release/Escape-Windows.zip Escape
          python3 - <<'PY'
          import hashlib, json, os
          def sha(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1 << 20), b""):
                      h.update(chunk)
              return h.hexdigest()
          env = os.environ
          # The launcher shows these patch notes while it downloads (docs/patch_notes.txt + docs/patch_notes.d, tools/patch_notes.py).
          import subprocess
          notes = subprocess.check_output(["python3", "../tools/patch_notes.py", "build", subprocess.run(["git", "rev-parse", "-q", "--verify", "refs/tags/windows"], capture_output=True, text=True).stdout.strip()], text=True)
          manifest = {
              "version": env["VERSION"], "build": env["BUILD"], "notes": notes,
              "pack_size": os.path.getsize("release/Escape.pck"), "pack_sha256": sha("release/Escape.pck"),
              "launcher": env["REV"], "launcher_file": "Escape.exe",
              "launcher_size": os.path.getsize("release/Escape.exe"), "launcher_sha256": sha("release/Escape.exe"),
              "engine_file": "EscapeGame.exe",
              "engine_size": os.path.getsize("release/EscapeGame.exe"), "engine_sha256": sha("release/EscapeGame.exe"),
          }
          json.dump(manifest, open("release/version.json", "w"), indent=1)
          print(json.dumps(manifest, indent=1))
          PY
          ls -la release

      - name: Keep the zip on this run
        uses: actions/upload-artifact@v4
        with:
          name: Escape-Windows-${{ env.VERSION }}.${{ env.BUILD }}
          path: build/Escape
          retention-days: 14

      - name: Publish on the release "windows"
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          cd build/release
          notes="Escape! $VERSION.$BUILD for Windows.

          Download **Escape-Windows.zip**, unpack it anywhere and start **Escape.exe**. The launcher keeps the game up to date by itself.

          Built from $SHA."
          # The tag follows the newest build.
          git tag -f windows "$SHA"
          git push -f origin refs/tags/windows
          if gh release view windows >/dev/null 2>&1; then
            # The files first, version.json last: the launcher only looks for a new game once
            # the files it names are in place.
            gh release upload windows Escape.exe EscapeGame.exe Escape.pck Escape-Windows.zip --clobber
            gh release upload windows version.json --clobber
            gh release edit windows --title "Escape! for Windows ($VERSION.$BUILD)" --notes "$notes" --latest
          else
            gh release create windows Escape.exe EscapeGame.exe Escape.pck Escape-Windows.zip version.json \
              --title "Escape! for Windows ($VERSION.$BUILD)" --notes "$notes" --latest
          fi
