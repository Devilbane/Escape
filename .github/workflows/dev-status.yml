name: Dev status

# Keeps a one-line status of the development (open and recently merged pull requests) on the
# `dev-status` branch, in `status.txt`. A Twitch Nightbot command reads it with
#   $(urlfetch https://raw.githubusercontent.com/devilbane/escape/dev-status/status.txt)

on:
  pull_request_target:
    types: [opened, reopened, closed, ready_for_review, converted_to_draft]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dev-status
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      # Only the default branch is checked out; code from a pull request is never run here.
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Build the status line
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/dev_status.py "$RUNNER_TEMP/status.txt"
      # The repository requires verified signatures, so the file is written through the contents API
      # (GitHub signs those commits) instead of a git push.
      - name: Publish it on the dev-status branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="${{ github.repository }}"
          if ! gh api "repos/$repo/git/ref/heads/dev-status" >/dev/null 2>&1; then
            gh api "repos/$repo/git/refs" -f ref=refs/heads/dev-status -f sha="$(git rev-parse HEAD)" >/dev/null
          fi
          sha="$(gh api "repos/$repo/contents/status.txt?ref=dev-status" --jq .sha 2>/dev/null || true)"
          args=(-X PUT "repos/$repo/contents/status.txt" -f message="Update dev status" -f branch=dev-status \
                -f content="$(base64 -w0 "$RUNNER_TEMP/status.txt")")
          if [ -n "$sha" ]; then args+=(-f sha="$sha"); fi
          gh api "${args[@]}" >/dev/null
