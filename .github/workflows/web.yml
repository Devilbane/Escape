name: Browser version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $templates
          unzip -qj Godot_v*_export_templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d $templates
          rm Godot_v*_export_templates.tpz

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Map letters (no two things share a letter)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/tile_letters.gd | tee tiles.log
          grep -q PASS tiles.log

      - name: Furniture spacing (no two chests or boards side by side)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/furniture_spacing.gd | tee spacing.log
          grep -q PASS spacing.log

      - name: Furniture blocks only where it is drawn (nobody gets stuck on it)
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/furniture_stuck.gd | tee stuck.log
          grep -q PASS stuck.log && ! grep -q FAIL stuck.log

      - name: English texts (no German text translated twice)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/lang_keys.gd | tee lang.log
          grep -q PASS lang.log

      - name: Cobwebs (spread out, off grates, doors and corridor floors)
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/cobwebs.gd | tee cobwebs.log
          grep -q PASS cobwebs.log

      - name: Level warm-up (no hitch when a level starts)
        run: |
          timeout 120 ~/godot/godot --headless -s tests/level_warmup.gd | tee warmup.log
          grep -q PASS warmup.log

      - name: Play through all levels automatically
        run: |
          timeout 600 ~/godot/godot --headless --fixed-fps 60 -s tests/play_all_levels.gd | tee test.log
          grep -q PASS test.log

      - name: Inventory keeps its size (picking, tabs, equipping; both languages)
        run: |
          timeout 120 ~/godot/godot --headless -s tests/inventory_fixed_size.gd | tee inventory.log
          grep -q PASS inventory.log

      - name: Event bus test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/events.gd | tee events.log
          grep -q PASS events.log

      - name: Grate tentacles test
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/grate_tentacles.gd | tee tentacles.log
          grep -q PASS tentacles.log

      - name: Locked doors (no getting stuck, no blows through them) test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/door_safety.gd | tee doors.log
          grep -q PASS doors.log

      - name: Time away (offline activities) test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/offline_schedule.gd | tee offline.log
          grep -q PASS offline.log

      - name: Villager reputation test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/reputation.gd | tee reputation.log
          grep -q PASS reputation.log

      - name: Crafting square test
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/crafting_square.gd | tee crafting_square.log
          grep -q PASS crafting_square.log

      - name: Fox companion test
        run: |
          timeout 400 ~/godot/godot --headless --fixed-fps 60 -s tests/fox.gd | tee fox.log
          grep -q PASS fox.log

      - name: Waking up in bed after loading test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/wake_up.gd | tee wake.log
          grep -q PASS wake.log

      - name: Shrine gifts hand control straight back test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/shrine.gd | tee shrine.log
          grep -q PASS shrine.log

      - name: Sitting on the benches of the market square test
        run: |
          timeout 200 ~/godot/godot --headless --fixed-fps 60 -s tests/seats.gd | tee seats.log
          grep -q PASS seats.log && ! grep -q FAIL seats.log

      - name: Graveyard start after the escape test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/graveyard_start.gd | tee graveyard.log
          grep -q PASS graveyard.log

      - name: Looted containers stay empty test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/looted_containers.gd | tee looted.log
          grep -q PASS looted.log

      - name: Rare loot does not repeat on a level test
        run: |
          timeout 300 ~/godot/godot --headless -s tests/rare_loot.gd | tee rare_loot.log
          grep -q PASS rare_loot.log

      - name: Floor items test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/floor_items.gd | tee floor_items.log
          grep -q PASS floor_items.log

      - name: Dragon's helpers and hoard test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/dragon_hoard.gd | tee dragon_hoard.log
          grep -q PASS dragon_hoard.log

      - name: Torch stacks test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/torch_stacks.gd | tee torch_stacks.log
          grep -q PASS torch_stacks.log

      - name: Several saved games test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/save_slots.gd | tee slots.log
          grep -q PASS slots.log

      - name: Barber test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/barber.gd | tee barber.log
          grep -q PASS barber.log

      - name: Merchant trading window test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/merchant_window.gd | tee merchant_window.log
          grep -q PASS merchant_window.log

      - name: Map workshop test
        run: |
          timeout 180 ~/godot/godot --headless -s tests/level_editor.gd | tee level_editor.log
          grep -q PASS level_editor.log

      - name: Testing a map from the workshop
        run: |
          timeout 180 ~/godot/godot --headless -s tests/playtest_map.gd | tee playtest_map.log
          grep -q PASS playtest_map.log

      - name: Window buttons, hover and keyboard focus test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/window_buttons.gd | tee window_buttons.log
          grep -q PASS window_buttons.log

      - name: Character page test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/character_page.gd | tee character_page.log
          grep -q PASS character_page.log

      - name: Villager quests test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/quests.gd | tee quests.log
          grep -q PASS quests.log

      - name: Villager names after a talk test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/npc_names.gd | tee names.log
          grep -q PASS names.log

      - name: Explanatory hints shown only twice test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/bump_hint.gd | tee hints.log
          grep -q PASS hints.log

      - name: First steps in the cell (tutorial cards) test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/tutorial.gd | tee tutorial.log
          grep -q PASS tutorial.log

      - name: Villager speech cooldown test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/npc_speech_cooldown.gd | tee speech.log
          grep -q PASS speech.log

      - name: Villager speech overlap test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/npc_speech_overlap.gd | tee overlap.log
          grep -q PASS overlap.log

      - name: Wild bandits on the robbers' pass test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/wild_bandits.gd | tee bandits.log
          grep -q PASS bandits.log

      - name: Beasts of the wolf hollow test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/wild_beasts.gd | tee beasts.log
          grep -q PASS beasts.log

      - name: Monster rivals and befriending test
        run: |
          timeout 180 ~/godot/godot --headless --fixed-fps 60 -s tests/factions.gd | tee factions.log
          grep -q PASS factions.log

      - name: Peaceful animals of the woods test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/animals.gd | tee animals.log
          grep -q PASS animals.log

      - name: Dragon's lair test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/dragon_lair.gd | tee lair.log
          grep -q PASS lair.log

      - name: Dragon boss fight test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/dragon_boss.gd | tee dragon.log
          grep -q PASS dragon.log

      - name: Corpses stay and rot away test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/corpses.gd | tee corpses.log
          grep -q PASS corpses.log

      - name: Dark holes, torches and horrors test
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/horrors.gd | tee horrors.log
          grep -q PASS horrors.log

      - name: Bandit chief boss fight test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/bandit_chief.gd | tee chief.log
          grep -q PASS chief.log

      - name: Strike, sweep and fighting back test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/splash_attack.gd | tee splash.log
          grep -q PASS splash.log

      - name: Hero or heroine test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/heroine.gd | tee heroine.log
          grep -q PASS heroine.log

      - name: Damage numbers over the head test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/damage_numbers.gd | tee damage_numbers.log
          grep -q PASS damage_numbers.log

      - name: Messages never cover each other test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/message_overlap.gd | tee message_overlap.log
          grep -q PASS message_overlap.log

      - name: Event log test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/event_log.gd | tee event_log.log
          grep -q PASS event_log.log

      - name: Hero and skeletons cannot stack test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/no_stacking.gd | tee stacking.log
          grep -q PASS stacking.log

      - name: Crates and food basket test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/crates.gd | tee crates.log
          grep -q PASS crates.log

      - name: Building with stone blocks test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/stones.gd | tee stones.log
          grep -q PASS stones.log

      - name: Smith's forge test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/forge.gd | tee forge.log
          grep -q PASS forge.log

      - name: Stone walls and the block-pushing puzzle test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/stone_puzzle.gd | tee puzzle.log
          grep -q PASS puzzle.log

      - name: Pull-out button menu test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/hud_drawer.gd | tee drawer.log
          grep -q PASS drawer.log

      - name: Quick window icons and quests window test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/quick_bar.gd | tee quick_bar.log
          grep -q PASS quick_bar.log

      - name: Background music test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/music.gd | tee music.log
          grep -q PASS music.log

      - name: Eerie dungeon sounds test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/dungeon_sounds.gd | tee dungeon_sounds.log
          grep -q PASS dungeon_sounds.log

      - name: Day and night test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/day_night.gd | tee daynight.log
          grep -q PASS daynight.log

      - name: Wandering merchant test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/wandering_merchant.gd | tee wanderer.log
          grep -q PASS wanderer.log

      - name: Weather test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/weather.gd | tee weather.log
          grep -q PASS weather.log

      - name: Village houses and chapel test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/village_buildings.gd | tee village.log
          grep -q PASS village.log

      - name: Map and journal test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/journal.gd | tee journal.log
          grep -q PASS journal.log

      - name: Town houses for many heroes test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/player_houses.gd | tee houses.log
          grep -q PASS houses.log

      - name: Recipes and ingredient pouch test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/crafting.gd | tee crafting.log
          grep -q PASS crafting.log

      - name: Wishes and fighting style test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/wishes.gd | tee wishes.log
          grep -q PASS wishes.log

      - name: Workbench crafting test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/workbench_crafting.gd | tee workbench.log
          grep -q PASS workbench.log

      - name: Fishing test
        run: |
          timeout 120 ~/godot/godot --headless -s tests/fishing.gd | tee fishing.log
          grep -q PASS fishing.log

      - name: Home upgrades test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/home_upgrades.gd | tee upgrades.log
          grep -q PASS upgrades.log

      - name: Mountains, tavern and mines test
        run: |
          timeout 200 ~/godot/godot --headless --fixed-fps 60 -s tests/mountains.gd | tee mountains.log
          grep -q PASS mountains.log

      - name: Hero level and experience test
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/hero_level.gd | tee hero_level.log
          grep -q PASS hero_level.log

      - name: Shrine gifts test
        run: |
          timeout 120 ~/godot/godot --headless --fixed-fps 60 -s tests/shrine.gd | tee shrine.log
          grep -q PASS shrine.log

      - name: Hidden traps test
        run: |
          timeout 200 ~/godot/godot --headless --fixed-fps 60 -s tests/traps.gd | tee traps.log
          grep -q PASS traps.log

      - name: Life on the ground above test
        run: |
          timeout 200 ~/godot/godot --headless --fixed-fps 60 -s tests/surface_life.gd | tee surface_life.log
          grep -q PASS surface_life.log

      - name: Export the browser version
        run: |
          sed -i 's/^const BUILD := .*/const BUILD := "${{ github.run_number }}"/' scripts/game.gd
          grep -q 'const BUILD := "${{ github.run_number }}"' scripts/game.gd
          mkdir -p build/web
          ~/godot/godot --headless --export-release Web build/web/index.html
          # A new file name for the game data on every build, so browsers
          # cannot keep showing an old version from their cache.
          v=${{ github.run_number }}
          # The plain index.pck stays too: a page still cached from an
          # older release asks for that name.
          cp build/web/index.pck build/web/index-$v.pck
          sed -i "s/\"executable\":\"index\"/\"executable\":\"index\",\"mainPack\":\"index-$v.pck\"/; s/\"index.pck\":/\"index-$v.pck\":/" build/web/index.html
          grep -q "\"mainPack\":\"index-$v.pck\"" build/web/index.html
          # A page still cached from an older build would ask for a pck that
          # is gone. version.txt names the live build; the page checks it
          # without the cache and reloads itself when it is out of date.
          echo "$v" > build/web/version.txt
          python3 - "$v" <<'PY'
          import sys
          v = sys.argv[1]
          guard = open("tools/web/version_check.html").read().replace("__BUILD__", v)
          page = open("build/web/index.html").read()
          assert "</head>" in page
          open("build/web/index.html", "w").write(page.replace("</head>", guard + "</head>", 1))
          PY
          grep -q "var build = \"$v\"" build/web/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
