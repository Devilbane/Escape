name: Full play-through

# The bot that plays every level (tests/play_all_levels.gd) takes a long time, so it is not part of
# the fast checks in web.yml and no longer runs on pull requests (it took a runner from the test shards).
# It runs
#   - every night on main, and
#   - on demand (Actions > Full play-through > Run workflow, on main or on any branch).
# See docs/testing.md.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: playthrough-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  playthrough:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Play through all levels automatically
        run: |
          timeout 2400 ~/godot/godot --headless --fixed-fps 60 -s tests/play_all_levels.gd | tee test.log
          grep -q PASS test.log
