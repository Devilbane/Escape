name: Browser version

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore Godot from the cache
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v*_linux.x86_64.zip && mv Godot_v*_linux.x86_64 godot && rm Godot_v*_linux.x86_64.zip
          templates=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $templates
          unzip -qj Godot_v*_export_templates.tpz templates/web_nothreads_release.zip templates/web_nothreads_debug.zip templates/version.txt -d $templates
          rm Godot_v*_export_templates.tpz

      - name: Import the project
        run: ~/godot/godot --headless --import

      - name: Map letters (no two things share a letter)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/tile_letters.gd | tee tiles.log
          grep -q PASS tiles.log

      - name: Monster families (every map names who lives there, every monster fits)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/monster_families.gd | tee families.log
          grep -q PASS families.log

      - name: Furniture spacing (no two chests or boards side by side)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/furniture_spacing.gd | tee spacing.log
          grep -q PASS spacing.log

      - name: Chests rest their back on the wall and open towards the room
        run: |
          timeout 60 ~/godot/godot --headless -s tests/chest_facing.gd | tee chests.log
          grep -q PASS chests.log

      - name: Furniture blocks only where it is drawn (nobody gets stuck on it)
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/furniture_stuck.gd | tee stuck.log
          grep -q PASS stuck.log && ! grep -q FAIL stuck.log

      - name: English texts (no German text translated twice)
        run: |
          timeout 60 ~/godot/godot --headless -s tests/lang_keys.gd | tee lang.log
          grep -q PASS lang.log

      - name: Loot and experience text sized by worth
        run: |
          timeout 60 ~/godot/godot --headless -s tests/loot_text_size.gd | tee lootsize.log
          grep -q PASS lootsize.log

      - name: Cobwebs (spread out, off grates, doors and corridor floors)
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/cobwebs.gd | tee cobwebs.log
          grep -q PASS cobwebs.log

      - name: Walls at full height (only the stretch in front of the hero turns see-through)
        run: |
          timeout 300 ~/godot/godot --headless --fixed-fps 60 -s tests/wall_height.gd | tee walls.log
